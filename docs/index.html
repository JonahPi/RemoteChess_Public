<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>Remote Chess</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }

        #status {
            text-align: center;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        #status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        #status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #board-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #board {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            background: #444;
            border: 3px solid #666;
            border-radius: 8px;
            padding: 2px;
        }

        .square {
            position: relative;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .square.light {
            background: #f0d9b5;
        }

        .square.dark {
            background: #b58863;
        }

        .square.selected {
            background: #7fc97f !important;
        }

        .led-indicator {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: transparent;
            transition: background-color 0.2s;
            z-index: 10;
        }

        .led-indicator.red {
            background: #ff0000;
            box-shadow: 0 0 8px #ff0000;
        }

        .led-indicator.green {
            background: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .led-indicator.blink {
            animation: blink 0.2s infinite;
        }

        .piece.unknown {
            color: #ff4444;
            font-size: 28px;
            font-weight: bold;
            animation: pulse-unknown 1s infinite;
        }

        @keyframes pulse-unknown {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .piece {
            width: 80%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 36px;
            font-family: 'Noto Sans Symbols 2', 'Chess Merida', sans-serif;
        }

        .piece.black {
            color: #000;
        }

        .piece.white {
            color: #fff;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        #controls {
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        #controls button {
            flex: 1;
            margin: 0;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
        }

        #flip-btn {
            background: #6600cc;
        }

        #flip-btn:active {
            background: #5200a3;
        }

        #undo-btn {
            background: #cc6600;
        }

        #undo-btn:active:not(:disabled) {
            background: #a35200;
        }

        #reset-btn {
            background: #0066cc;
        }

        #reset-btn:active {
            background: #0052a3;
        }

        #reset-btn.sync-mode {
            background: #cc6600;
        }

        #reset-btn.sync-mode:active {
            background: #a35200;
        }

        #reset-btn.confirm-mode {
            background: #00aa44;
        }

        #reset-btn.confirm-mode:active:not(:disabled) {
            background: #008833;
        }

        button:disabled {
            background: #555 !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="status">
            <span id="status-indicator"></span>
            <span id="status-text">Disconnected</span>
        </div>

        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="controls">
            <button id="flip-btn">Wechsel</button>
            <button id="undo-btn" disabled>Zurück</button>
            <button id="reset-btn">Neu starten</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        // MQTT Configuration for Adafruit IO — two separate streams
        const MQTT_CONFIG = {
            broker: 'io.adafruit.com',
            port: 443,
            useSSL: true,
            topicWhite: 'ToniTwn/feeds/chess-white',
            topicBlack: 'ToniTwn/feeds/chess-black',
            username: 'ToniTwn'
        };

        // Get or prompt for Adafruit IO Key (stored in localStorage)
        function getApiKey() {
            let key = localStorage.getItem('adafruit_io_key');
            if (!key) {
                key = prompt('Enter your Adafruit IO Key (API key):');
                if (key) {
                    localStorage.setItem('adafruit_io_key', key);
                }
            }
            return key;
        }

        // Clear stored API key (call from console if needed: clearApiKey())
        function clearApiKey() {
            localStorage.removeItem('adafruit_io_key');
            alert('API key cleared. Reload to enter a new key.');
        }

        // Chess pieces as text labels
        const PIECE_LABELS = {
            '♔': { label: '♔', color: 'white' },
            '♕': { label: '♕', color: 'white' },
            '♖': { label: '♖', color: 'white' },
            '♗': { label: '♗', color: 'white' },
            '♘': { label: '♘', color: 'white' },
            '♙': { label: '♙', color: 'white' },
            '♚': { label: '♚', color: 'black' },
            '♛': { label: '♛', color: 'black' },
            '♜': { label: '♜', color: 'black' },
            '♝': { label: '♝', color: 'black' },
            '♞': { label: '♞', color: 'black' },
            '♟': { label: '♟', color: 'black' }
        };

        // Initial board setup
        const INITIAL_BOARD = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];

        // Game state
        let board = JSON.parse(JSON.stringify(INITIAL_BOARD));
        let selectedSquare = null;
        let mqttClient = null;
        let isConnected = false;
        let ledStates = {};
        let externalLiftCoord = null;
        let fadingTimer = null;
        let lastMove = null;
        let boardFlipped = false;
        let promotedQueens = new Set();
        let awaitingSync = false;
        let syncMode = false;
        let syncResolutionMode = false;
        let unknownSquares = new Set();
        let resolutionSquares = new Set();

        // Two-stream color detection
        let playerColor = null;       // null, 'white', or 'black'
        let myPublishTopic = null;    // Set after color determination
        let ignoreRetainedWhite = false;
        let ignoreRetainedBlack = false;

        // FEN piece to Unicode mapping
        const FEN_TO_PIECE = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Unicode piece to FEN character mapping (reverse of FEN_TO_PIECE)
        const PIECE_TO_FEN = {
            '\u2654': 'K', '\u2655': 'Q', '\u2656': 'R', '\u2657': 'B', '\u2658': 'N', '\u2659': 'P',
            '\u265A': 'k', '\u265B': 'q', '\u265C': 'r', '\u265D': 'b', '\u265E': 'n', '\u265F': 'p'
        };

        const PIECE_CYCLE = ['?','♙','♘','♗','♖','♕','♔','♟','♞','♝','♜','♛','♚'];

        // Check if message is a game move (triggers color assignment)
        function isGameMove(message) {
            if (message === 'sync' || message === 'restart' || message === 'undo') return false;
            if (message.startsWith('fenfix:') || message.startsWith('fen:')) return false;
            return true;
        }

        // Check if any piece is in middle rows (3-6, array indices 2-5)
        function hasPiecesInMiddle() {
            for (let row = 2; row <= 5; row++) {
                for (let col = 0; col < 8; col++) {
                    if (board[row][col] !== '') {
                        return true;
                    }
                }
            }
            return false;
        }

        // Update the third button between "Neu starten", "Sync", and "Bestätigen"
        function updateThirdButton() {
            const btn = document.getElementById('reset-btn');
            const piecesInMiddle = hasPiecesInMiddle();

            if (syncResolutionMode) {
                btn.textContent = 'Bestätigen';
                btn.classList.remove('sync-mode');
                btn.classList.add('confirm-mode');
                btn.disabled = unknownSquares.size > 0;
                syncMode = false;
            } else if (piecesInMiddle && !syncMode) {
                syncMode = true;
                btn.textContent = 'Sync';
                btn.classList.add('sync-mode');
                btn.classList.remove('confirm-mode');
                btn.disabled = false;
            } else if (!piecesInMiddle && syncMode) {
                syncMode = false;
                btn.textContent = 'Neu starten';
                btn.classList.remove('sync-mode');
                btn.classList.remove('confirm-mode');
                btn.disabled = false;
            }
        }

        // Parse FEN notation and update board
        function parseFEN(fen) {
            const rows = fen.split('/');
            if (rows.length !== 8) {
                addLog('Invalid FEN: wrong number of rows', 'error');
                return false;
            }

            const newBoard = [];
            for (let i = 0; i < 8; i++) {
                const row = [];
                const fenRow = rows[i];
                for (let j = 0; j < fenRow.length; j++) {
                    const char = fenRow[j];
                    if (char >= '1' && char <= '8') {
                        const emptyCount = parseInt(char);
                        for (let k = 0; k < emptyCount; k++) {
                            row.push('');
                        }
                    } else if (FEN_TO_PIECE[char]) {
                        row.push(FEN_TO_PIECE[char]);
                    } else {
                        addLog(`Invalid FEN character: ${char}`, 'error');
                        return false;
                    }
                }
                if (row.length !== 8) {
                    addLog(`Invalid FEN: row ${i+1} has ${row.length} squares`, 'error');
                    return false;
                }
                newBoard.push(row);
            }

            board = newBoard;
            promotedQueens.clear();
            updateBoardUI();
            updateThirdButton();
            addLog('Board synced from ESP', 'success');
            return true;
        }

        // Convert board state to FEN notation (piece placement only)
        function boardToFEN() {
            const fenRows = [];
            for (let row = 0; row < 8; row++) {
                let fenRow = '';
                let emptyCount = 0;
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece === '') {
                        emptyCount++;
                    } else {
                        if (emptyCount > 0) {
                            fenRow += emptyCount;
                            emptyCount = 0;
                        }
                        fenRow += PIECE_TO_FEN[piece] || '?';
                    }
                }
                if (emptyCount > 0) fenRow += emptyCount;
                fenRows.push(fenRow);
            }
            return fenRows.join('/');
        }

        // Request sync from ESP
        function requestSync() {
            addLog('requestSync called, connected=' + isConnected, 'info');
            if (!isConnected) {
                addLog('Not connected to MQTT', 'error');
                return;
            }
            publishMove('sync');
            addLog('Sync requested from ESP', 'info');
        }

        function handleEnhancedSync(fen, occ) {
            const rows = fen.split('/');
            if (rows.length !== 8 || occ.length !== 64) {
                addLog('Invalid enhanced sync data', 'error');
                return;
            }

            const fenBoard = [];
            for (let i = 0; i < 8; i++) {
                const row = [];
                const fenRow = rows[i];
                for (let j = 0; j < fenRow.length; j++) {
                    const char = fenRow[j];
                    if (char >= '1' && char <= '8') {
                        for (let k = 0; k < parseInt(char); k++) row.push('');
                    } else if (FEN_TO_PIECE[char]) {
                        row.push(FEN_TO_PIECE[char]);
                    } else {
                        addLog('Invalid FEN character: ' + char, 'error');
                        return;
                    }
                }
                if (row.length !== 8) {
                    addLog('Invalid FEN row length', 'error');
                    return;
                }
                fenBoard.push(row);
            }

            unknownSquares = new Set();
            resolutionSquares = new Set();
            let hasConflicts = false;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const occIndex = row * 8 + col;
                    const sensorOccupied = occ[occIndex] === '1';
                    const fenPiece = fenBoard[row][col];

                    if (fenPiece !== '' && sensorOccupied) {
                        board[row][col] = fenPiece;
                    } else if (fenPiece === '' && !sensorOccupied) {
                        board[row][col] = '';
                    } else if (fenPiece === '' && sensorOccupied) {
                        board[row][col] = '?';
                        const key = row + ',' + col;
                        unknownSquares.add(key);
                        resolutionSquares.add(key);
                        hasConflicts = true;
                    } else {
                        board[row][col] = '';
                    }
                }
            }

            updateBoardUI();

            if (hasConflicts) {
                syncResolutionMode = true;
                updateThirdButton();
                addLog(unknownSquares.size + ' unknown piece(s) - tap to identify', 'info');
            } else {
                addLog('Board synced from ESP (no conflicts)', 'success');
                updateThirdButton();
            }
        }

        function cyclePiece(row, col) {
            const currentPiece = board[row][col];
            const currentIndex = PIECE_CYCLE.indexOf(currentPiece);
            const nextIndex = (currentIndex + 1) % PIECE_CYCLE.length;
            board[row][col] = PIECE_CYCLE[nextIndex];

            const key = row + ',' + col;
            if (PIECE_CYCLE[nextIndex] === '?') {
                unknownSquares.add(key);
            } else {
                unknownSquares.delete(key);
            }

            updateBoardUI();
            updateThirdButton();
        }

        // Initialize board UI
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let displayRow = 0; displayRow < 8; displayRow++) {
                for (let displayCol = 0; displayCol < 8; displayCol++) {
                    const row = boardFlipped ? (7 - displayRow) : displayRow;
                    const col = boardFlipped ? (7 - displayCol) : displayCol;

                    const square = document.createElement('div');
                    const coord = String.fromCharCode(65 + col) + (8 - row);

                    square.className = 'square ' + ((displayRow + displayCol) % 2 === 0 ? 'light' : 'dark');
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.dataset.coord = coord;

                    const led = document.createElement('div');
                    led.className = 'led-indicator';
                    led.dataset.coord = coord;
                    square.appendChild(led);

                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    const pieceSymbol = board[row][col];
                    if (pieceSymbol === '?') {
                        piece.textContent = '?';
                        piece.classList.add('unknown');
                    } else if (pieceSymbol && PIECE_LABELS[pieceSymbol]) {
                        piece.textContent = PIECE_LABELS[pieceSymbol].label;
                        piece.classList.add(PIECE_LABELS[pieceSymbol].color);
                    }
                    square.appendChild(piece);

                    square.addEventListener('click', () => handleSquareClick(row, col, coord));
                    boardEl.appendChild(square);
                }
            }

            // Restore LED states after re-rendering
            Object.keys(ledStates).forEach(coord => {
                const state = ledStates[coord];
                if (state.color) {
                    const led = document.querySelector(`.led-indicator[data-coord="${coord}"]`);
                    if (led) {
                        led.classList.add(state.color);
                        if (state.blink) {
                            led.classList.add('blink');
                        }
                    }
                }
            });
        }

        // Handle square click
        function handleSquareClick(row, col, coord) {
            // Handle sync resolution taps
            if (syncResolutionMode) {
                const key = row + ',' + col;
                if (resolutionSquares.has(key)) {
                    cyclePiece(row, col);
                }
                return;
            }

            if (!isConnected) {
                addLog('Not connected to MQTT', 'error');
                return;
            }

            if (awaitingSync) {
                addLog('Waiting for board to sync move', 'error');
                return;
            }

            if (selectedSquare === null) {
                // Select piece - save piece identity now
                if (board[row][col] !== '') {
                    selectedSquare = { row, col, coord, piece: board[row][col] };
                    document.querySelector(`[data-coord="${coord}"]`).classList.add('selected');
                    publishMove(coord + '-L');
                    // Local LED update: red on selected square
                    clearAllLEDs();
                    updateLED(coord, 'red', false);
                    if (fadingTimer) {
                        clearTimeout(fadingTimer);
                        fadingTimer = null;
                    }
                }
            } else {
                // Move piece
                const fromCoord = selectedSquare.coord;
                const toCoord = coord;

                const movingPiece = selectedSquare.piece;
                lastMove = {
                    previousBoard: JSON.parse(JSON.stringify(board)),
                    fromRow: selectedSquare.row,
                    fromCol: selectedSquare.col,
                    toRow: row,
                    toCol: col,
                    movedPiece: movingPiece,
                    capturedPiece: board[row][col]
                };
                document.getElementById('undo-btn').disabled = false;

                let pieceTransformed = false;
                if (selectedSquare.row === row && selectedSquare.col === col) {
                    const piece = movingPiece;
                    const coordKey = `${row},${col}`;
                    if (piece === '♙' && row === 0) {
                        board[row][col] = '♕';
                        promotedQueens.add(coordKey);
                        pieceTransformed = true;
                        addLog('White pawn promoted to queen', 'info');
                    } else if (piece === '♕' && row === 0 && promotedQueens.has(coordKey)) {
                        board[row][col] = '♙';
                        promotedQueens.delete(coordKey);
                        pieceTransformed = true;
                        addLog('White queen demoted to pawn', 'info');
                    }
                    else if (piece === '♟' && row === 7) {
                        board[row][col] = '♛';
                        promotedQueens.add(coordKey);
                        pieceTransformed = true;
                        addLog('Black pawn promoted to queen', 'info');
                    } else if (piece === '♛' && row === 7 && promotedQueens.has(coordKey)) {
                        board[row][col] = '♟';
                        promotedQueens.delete(coordKey);
                        pieceTransformed = true;
                        addLog('Black queen demoted to pawn', 'info');
                    }
                } else {
                    board[row][col] = movingPiece;
                    board[selectedSquare.row][selectedSquare.col] = '';
                }

                // Clear selection
                document.querySelector(`[data-coord="${fromCoord}"]`).classList.remove('selected');
                selectedSquare = null;

                if (fromCoord === toCoord && !pieceTransformed) {
                    publishMove(toCoord + '-R');
                    // Local LED update: clear LED (return)
                    updateLED(toCoord, null, false);
                    if (fadingTimer) {
                        clearTimeout(fadingTimer);
                        fadingTimer = null;
                    }
                } else {
                    publishMove(toCoord + '-P|' + boardToFEN());
                    awaitingSync = true;
                    // Local LED update: green on destination
                    updateLED(toCoord, 'green', false);
                    if (fadingTimer) clearTimeout(fadingTimer);
                    fadingTimer = setTimeout(() => {
                        clearAllLEDs();
                        fadingTimer = null;
                        awaitingSync = false;
                    }, 30000);
                }

                updateBoardUI();
            }
        }

        // Update board UI
        function updateBoardUI() {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const coord = String.fromCharCode(65 + col) + (8 - row);
                    const square = document.querySelector(`[data-coord="${coord}"]`);
                    const piece = square.querySelector('.piece');
                    const pieceSymbol = board[row][col];

                    piece.className = 'piece';
                    if (pieceSymbol === '?') {
                        piece.textContent = '?';
                        piece.classList.add('unknown');
                    } else if (pieceSymbol && PIECE_LABELS[pieceSymbol]) {
                        piece.textContent = PIECE_LABELS[pieceSymbol].label;
                        piece.classList.add(PIECE_LABELS[pieceSymbol].color);
                    } else {
                        piece.textContent = '';
                    }
                }
            }
            updateThirdButton();
        }

        // Update LED indicator
        function updateLED(coord, color, blink = false) {
            const led = document.querySelector(`.led-indicator[data-coord="${coord}"]`);
            if (led) {
                led.className = 'led-indicator';
                if (color) {
                    led.classList.add(color);
                    if (blink) {
                        led.classList.add('blink');
                    }
                }
                ledStates[coord] = { color, blink };
            }
        }

        // Clear all LEDs
        function clearAllLEDs() {
            document.querySelectorAll('.led-indicator').forEach(led => {
                led.className = 'led-indicator';
            });
            ledStates = {};
        }

        // Update color display in status bar
        function updateColorDisplay() {
            const text = document.getElementById('status-text');
            if (playerColor) {
                const colorLabel = playerColor === 'white' ? 'White' : 'Black';
                text.textContent = isConnected ? 'Connected (' + colorLabel + ')' : 'Disconnected';
            } else {
                text.textContent = isConnected ? 'Connected' : 'Disconnected';
            }
        }

        // MQTT Functions
        function connectMQTT() {
            const { broker, port, topicWhite, topicBlack, useSSL, username } = MQTT_CONFIG;
            const password = getApiKey();

            if (!password) {
                addLog('No API key provided. Cannot connect.', 'error');
                updateConnectionStatus(false);
                return;
            }

            const clientId = 'chess_pwa_' + Math.random().toString(16).substr(2, 8);
            const protocol = useSSL ? 'wss' : 'ws';

            addLog(`Connecting to ${protocol}://${broker}:${port}/mqtt`, 'info');

            try {
                mqttClient = new Paho.MQTT.Client(broker, port, '/mqtt', clientId);

                mqttClient.onConnectionLost = (responseObject) => {
                    if (responseObject.errorCode !== 0) {
                        addLog('Connection lost: ' + responseObject.errorMessage, 'error');
                        updateConnectionStatus(false);
                        setTimeout(connectMQTT, 3000);
                    }
                };

                mqttClient.onMessageArrived = (message) => {
                    handleMQTTMessage(message.payloadString, message.destinationName);
                };

                const connectOptions = {
                    onSuccess: () => {
                        addLog('Connected to Adafruit IO!', 'success');
                        updateConnectionStatus(true);
                        // Subscribe to both topics
                        ignoreRetainedWhite = true;
                        ignoreRetainedBlack = true;
                        mqttClient.subscribe(topicWhite);
                        mqttClient.subscribe(topicBlack);
                        addLog('Subscribed to ' + topicWhite + ' and ' + topicBlack, 'success');

                        // Connection indication
                        updateLED('D4', 'green', false);
                        updateLED('E4', 'green', false);
                        updateLED('D5', 'red', false);
                        updateLED('E5', 'red', false);
                        setTimeout(() => {
                            updateLED('D4', null, false);
                            updateLED('E4', null, false);
                            updateLED('D5', null, false);
                            updateLED('E5', null, false);
                            requestSync();
                        }, 1000);
                    },
                    onFailure: (error) => {
                        addLog('Connection failed: ' + error.errorMessage, 'error');
                        updateConnectionStatus(false);
                        if (error.errorMessage && error.errorMessage.includes('not authorized')) {
                            localStorage.removeItem('adafruit_io_key');
                            addLog('Invalid API key cleared. Reload to try again.', 'error');
                        } else {
                            setTimeout(connectMQTT, 5000);
                        }
                    },
                    useSSL: useSSL,
                    timeout: 10,
                    keepAliveInterval: 30,
                    userName: username,
                    password: password
                };

                mqttClient.connect(connectOptions);
            } catch (error) {
                addLog('Error: ' + error.message, 'error');
                updateConnectionStatus(false);
            }
        }

        function publishMove(message) {
            if (mqttClient && isConnected) {
                // Auto color detection: first game move = white
                if (playerColor === null && isGameMove(message)) {
                    playerColor = 'white';
                    myPublishTopic = MQTT_CONFIG.topicWhite;
                    updateColorDisplay();
                    addLog('Color determined: WHITE (first to move)', 'info');
                }

                // Use assigned topic, or default to white for pre-color control messages
                const topic = myPublishTopic || MQTT_CONFIG.topicWhite;

                try {
                    const mqttMessage = new Paho.MQTT.Message(message);
                    mqttMessage.destinationName = topic;
                    mqttClient.send(mqttMessage);
                    addLog('Sent to ' + topic + ': ' + message, 'sent');
                } catch (error) {
                    addLog('Publish error: ' + error.message, 'error');
                }
            }
        }

        function handleMQTTMessage(message, topic) {
            // Skip retained messages per-topic
            if (topic === MQTT_CONFIG.topicWhite && ignoreRetainedWhite) {
                ignoreRetainedWhite = false;
                addLog('Skipped retained on white: ' + message, 'info');
                return;
            }
            if (topic === MQTT_CONFIG.topicBlack && ignoreRetainedBlack) {
                ignoreRetainedBlack = false;
                addLog('Skipped retained on black: ' + message, 'info');
                return;
            }

            // After color detection, ignore messages on own publish topic
            if (playerColor === 'white' && topic === MQTT_CONFIG.topicWhite) return;
            if (playerColor === 'black' && topic === MQTT_CONFIG.topicBlack) return;

            // Auto color detection from received game moves
            if (playerColor === null && isGameMove(message)) {
                if (topic === MQTT_CONFIG.topicWhite) {
                    playerColor = 'black';
                    myPublishTopic = MQTT_CONFIG.topicBlack;
                    updateColorDisplay();
                    addLog('Color determined: BLACK (received white\'s move)', 'info');
                    // Auto-flip board for black player
                    if (!boardFlipped) {
                        flipBoard();
                    }
                } else if (topic === MQTT_CONFIG.topicBlack) {
                    playerColor = 'white';
                    myPublishTopic = MQTT_CONFIG.topicWhite;
                    updateColorDisplay();
                    addLog('Color determined: WHITE (received black\'s move)', 'info');
                }
            }

            addLog('Received on ' + topic + ': ' + message, 'received');

            // --- Dispatch special messages ---

            // Handle FEN sync response
            if (message.startsWith('fen:')) {
                const payload = message.substring(4);
                const pipeIndex = payload.indexOf('|');

                if (pipeIndex !== -1) {
                    const fen = payload.substring(0, pipeIndex);
                    const occ = payload.substring(pipeIndex + 1);
                    addLog('Enhanced sync: FEN + occupancy', 'info');
                    handleEnhancedSync(fen, occ);
                } else {
                    addLog('Parsing FEN: ' + payload, 'info');
                    parseFEN(payload);
                }
                return;
            }

            // Ignore fenfix (only relevant for ESP)
            if (message.startsWith('fenfix:')) {
                addLog('Ignoring fenfix (not relevant for PWA)', 'info');
                return;
            }

            // Ignore sync requests (only relevant for ESP)
            if (message === 'sync') {
                addLog('Ignoring sync request (not relevant for PWA)', 'info');
                return;
            }

            // Handle restart message
            if (message === 'restart') {
                board = JSON.parse(JSON.stringify(INITIAL_BOARD));
                selectedSquare = null;
                externalLiftCoord = null;
                lastMove = null;
                promotedQueens.clear();
                awaitingSync = false;
                // Reset color for new game
                playerColor = null;
                myPublishTopic = null;
                ignoreRetainedWhite = true;
                ignoreRetainedBlack = true;
                updateColorDisplay();
                document.getElementById('undo-btn').disabled = true;
                initBoard();
                clearAllLEDs();
                updateThirdButton();
                addLog('External restart received', 'info');
                return;
            }

            // Handle undo message
            if (message === 'undo') {
                if (lastMove) {
                    board = lastMove.previousBoard;
                    clearAllLEDs();
                    awaitingSync = false;
                    updateBoardUI();
                    lastMove = null;
                    document.getElementById('undo-btn').disabled = true;
                    addLog('External undo received', 'info');
                }
                return;
            }

            // --- Parse move message ---

            if (message.length < 4) return;

            let movePart = message;
            let receivedFEN = null;
            const pipeIndex = message.indexOf('|');
            if (pipeIndex !== -1) {
                movePart = message.substring(0, pipeIndex);
                receivedFEN = message.substring(pipeIndex + 1);
            }

            const coord = movePart.substring(0, movePart.length - 2);
            const action = movePart.charAt(movePart.length - 1);

            // All received messages are from opponent — no echo detection needed

            switch (action) {
            case 'L':
                // Opponent lift — set red LED
                if (externalLiftCoord === null) {
                    clearAllLEDs();
                }
                externalLiftCoord = coord;
                updateLED(coord, 'red', false);
                if (fadingTimer) {
                    clearTimeout(fadingTimer);
                    fadingTimer = null;
                }
                break;

            case 'P':
            case 'X':
                // Opponent place or capture — set green LED, apply FEN
                updateLED(coord, 'green', false);

                const previousBoard = JSON.parse(JSON.stringify(board));

                if (receivedFEN) {
                    parseFEN(receivedFEN);
                    addLog('External ' + (action === 'X' ? 'capture' : 'move') + ' applied via FEN', 'info');
                }

                lastMove = { previousBoard: previousBoard };
                document.getElementById('undo-btn').disabled = false;
                externalLiftCoord = null;

                if (fadingTimer) {
                    clearTimeout(fadingTimer);
                }
                fadingTimer = setTimeout(() => {
                    clearAllLEDs();
                    fadingTimer = null;
                    awaitingSync = false;
                }, 30000);
                break;

            case 'R':
                // Opponent return
                updateLED(coord, null, false);
                externalLiftCoord = null;
                if (fadingTimer) {
                    clearTimeout(fadingTimer);
                    fadingTimer = null;
                }
                break;

            case 'O':
                // Sync confirmation from board
                updateLED(coord, null, false);
                delete ledStates[coord];
                const hasActiveLEDs = Object.values(ledStates).some(s => s.color);
                if (!hasActiveLEDs) {
                    awaitingSync = false;
                    if (fadingTimer) {
                        clearTimeout(fadingTimer);
                        fadingTimer = null;
                    }
                }
                break;
            }
        }

        function updateConnectionStatus(connected) {
            isConnected = connected;
            const indicator = document.getElementById('status-indicator');

            if (connected) {
                indicator.classList.add('connected');
            } else {
                indicator.classList.remove('connected');
            }
            updateColorDisplay();
        }

        function addLog(message, type = 'info') {
            console.log(`[${type}] ${message}`);
        }

        function resetBoard() {
            addLog('resetBoard called, syncMode=' + syncMode, 'info');
            if (syncResolutionMode) {
                confirmSyncResolution();
                return;
            }
            if (syncMode) {
                requestSync();
                return;
            }

            board = JSON.parse(JSON.stringify(INITIAL_BOARD));
            selectedSquare = null;
            externalLiftCoord = null;
            lastMove = null;
            promotedQueens.clear();
            awaitingSync = false;
            // Reset color for new game
            playerColor = null;
            myPublishTopic = null;
            ignoreRetainedWhite = true;
            ignoreRetainedBlack = true;
            updateColorDisplay();
            document.getElementById('undo-btn').disabled = true;
            initBoard();
            clearAllLEDs();
            updateThirdButton();
            addLog('Board reset', 'info');
            publishMove('restart');
            if (!isConnected) {
                connectMQTT();
            }
        }

        function confirmSyncResolution() {
            if (unknownSquares.size > 0) {
                addLog('Cannot confirm: ' + unknownSquares.size + ' unknown piece(s) remaining', 'error');
                return;
            }

            const correctedFEN = boardToFEN();
            publishMove('fenfix:' + correctedFEN);
            addLog('Sent corrected FEN to ESP: ' + correctedFEN, 'success');

            syncResolutionMode = false;
            unknownSquares = new Set();
            resolutionSquares = new Set();

            const btn = document.getElementById('reset-btn');
            btn.classList.remove('confirm-mode');
            btn.disabled = false;
            updateThirdButton();
            updateBoardUI();
        }

        function undoMove() {
            if (!lastMove) return;

            board = lastMove.previousBoard;
            clearAllLEDs();
            awaitingSync = false;
            updateBoardUI();
            lastMove = null;
            document.getElementById('undo-btn').disabled = true;
            publishMove('undo');
            addLog('Move undone', 'info');
        }

        function flipBoard() {
            boardFlipped = !boardFlipped;
            if (selectedSquare) {
                document.querySelector(`[data-coord="${selectedSquare.coord}"]`)?.classList.remove('selected');
                selectedSquare = null;
            }
            initBoard();
            addLog('Board flipped: ' + (boardFlipped ? 'black on bottom' : 'white on bottom'), 'info');
        }

        // Event listeners
        document.getElementById('flip-btn').addEventListener('click', flipBoard);
        document.getElementById('undo-btn').addEventListener('click', undoMove);
        document.getElementById('reset-btn').addEventListener('click', resetBoard);

        // Initialize
        initBoard();
        updateThirdButton();
        addLog('Chess PWA ready', 'info');

        // Auto-connect on load
        connectMQTT();
    </script>
</body>
</html>
